<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="ratecla.im">
  <title>ratecla.im</title>
  <desc>The ratecla.im mark: a lime square with a dot and a bar. A redaction bar slides off the bar to show the rate nobody publishes, then closes again.</desc>
  <style>
    /* One 5s cycle: the dark bar is covered, the cover slides off (the rate is revealed), holds, and slides back. */
    .cover { transform-box: fill-box; transform-origin: top center; animation: reveal 5s cubic-bezier(.77,0,.18,1) infinite; }
    .dot   { transform-box: fill-box; transform-origin: center; animation: ping 5s ease-in-out infinite; }
    @keyframes reveal { 0%,15% { transform: scaleY(1) } 35%,80% { transform: scaleY(0) } 95%,100% { transform: scaleY(1) } }
    @keyframes ping   { 0%,30% { transform: scale(1) } 38% { transform: scale(1.12) } 46%,100% { transform: scale(1) } }
    @media (prefers-reduced-motion: reduce) { .cover, .dot { animation: none } .cover { display: none } }
  </style>
  <rect x="10" y="10" width="100" height="100" rx="25" fill="#B0EE65"/>
  <circle class="dot" cx="45" cy="60" r="14" fill="#0C110D"/>
  <rect x="67" y="39" width="14" height="42" rx="7" fill="#0C110D"/>
  <rect class="cover" x="64" y="36" width="20" height="48" rx="6" fill="#B0EE65"/>
</svg>
