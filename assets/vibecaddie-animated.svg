<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="VibeCaddie">
  <title>VibeCaddie</title>
  <desc>The caddie mark. A club held on the green while an audit sweeps across it, pass after pass.</desc>
  <style>
    /* Every cycle keeps something moving. The sweep never parks off-screen, so
       the mark reads as alive at 30px in the registry, not only at full size. */
    .sweep { animation: sweep 3s linear infinite; }
    .club  { transform-origin: 60px 60px; transform-box: view-box; animation: stroke 3s ease-in-out infinite; }
    .ball  { transform-origin: 34px 86px; transform-box: view-box; animation: ball 3s ease-in-out infinite; }
    @keyframes sweep  { from { transform: translateX(-46px) } to { transform: translateX(150px) } }
    /* CSS transform overrides the transform attribute, so the base 20deg is
       carried in every keyframe rather than left on the element. */
    @keyframes stroke { 0%, 100% { transform: rotate(20deg) } 32% { transform: rotate(11deg) } 66% { transform: rotate(27deg) } }
    @keyframes ball   { 0%, 100% { opacity: .3; transform: scale(1) } 56% { opacity: 1; transform: scale(1.4) } }
    @media (prefers-reduced-motion: reduce) { .sweep, .club, .ball { animation: none } }
  </style>
  <defs>
    <clipPath id="vc-plate">
      <rect x="10" y="10" width="100" height="100" rx="28"/>
    </clipPath>
    <linearGradient id="vc-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#EDEBE6" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#EDEBE6" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#EDEBE6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="100" height="100" rx="28" fill="#4ADE80"/>
  <g clip-path="url(#vc-plate)">
    <rect class="club" x="50.9" y="28.2" width="18.2" height="63.6" rx="9.1" fill="#0A0C0B" transform="rotate(20 60 60)"/>
    <circle class="ball" cx="34" cy="86" r="6" fill="#0A0C0B" opacity=".3"/>
    <rect class="sweep" x="-36" y="10" width="36" height="100" fill="url(#vc-sweep)"/>
  </g>
</svg>
