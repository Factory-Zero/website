<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Undercover Rockstars">
  <style>
@keyframes urSpin{to{transform:rotate(360deg)}}
@keyframes urSpinBack{to{transform:rotate(-360deg)}}
@keyframes urGlow{0%,100%{opacity:.30}50%{opacity:.12}}
.ur-halo{transform-origin:50px 50px;animation:urSpinBack 24s linear infinite,urGlow 4s ease-in-out infinite}
.ur-star{transform-origin:50px 50px;animation:urSpin 6s linear infinite}
@media (prefers-reduced-motion:reduce){.ur-halo,.ur-star{animation:none}}
  </style>
  <path class="ur-halo" d="M 50.00 4.00 L 60.33 35.78 L 93.75 35.79 L 66.71 55.43 L 77.04 87.21 L 50.00 67.57 L 22.96 87.21 L 33.29 55.43 L 6.25 35.79 L 39.67 35.78 Z" fill="none" stroke="#FF3B30" stroke-width="1.4" stroke-linejoin="round"/>
  <path class="ur-star" d="M 50.00 20.00 L 56.74 40.73 L 78.53 40.73 L 60.90 53.54 L 67.63 74.27 L 50.00 61.46 L 32.37 74.27 L 39.10 53.54 L 21.47 40.73 L 43.26 40.73 Z" fill="#FF3B30"/>
</svg>
