<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Bloodrank">
  <title>Bloodrank</title>
  <desc>The Bloodrank coffin: a glowing coffin with a pair of fangs. The fangs bite down and a drop of blood falls from one of them.</desc>
  <!-- SMIL animation (from the Bloodrank site's logo); CSS cannot pause it, so it is kept small and slow. -->
  <rect x="10" y="10" width="100" height="100" fill="#140C0D"/>
  <g transform="translate(33 16) scale(1.45)"><defs><linearGradient id="br-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a50"><animate attributeName="stop-color" values="#ff6a50;#ff2a1c;#ffb8a8;#ff6a50" dur="4s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#6a0410"/></linearGradient><radialGradient id="br-in" cx="0.5" cy="0.25" r="0.8"><stop offset="0" stop-color="#4a0a10"/><stop offset="1" stop-color="#0c0506"/></radialGradient><filter id="br-glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path d="M11 1 L25 1 L35 13 L30 51 L6 51 L1 13 Z" fill="#ff1a1a" opacity="0.35" filter="url(#br-glow)"><animate attributeName="opacity" values="0.15;0.6;0.2;0.5;0.15" dur="1.6s" repeatCount="indefinite" keyTimes="0;0.12;0.25;0.37;1"/></path><path d="M11 1 L25 1 L35 13 L30 51 L6 51 L1 13 Z" fill="url(#br-in)" stroke="url(#br-edge)" stroke-width="2" stroke-linejoin="round"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 5;0 0;0 0" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.55;0.62;0.72;1"/><path d="M11 24 L14 24 L12.5 34 Z" fill="#fbf1f0"/><path d="M22 24 L25 24 L23.5 34 Z" fill="#fbf1f0"/></g><path d="M8 23 Q18 27 28 23" stroke="#7a0510" stroke-width="1.4" fill="none"/><ellipse cx="23.5" cy="36" rx="1.6" ry="2.2" fill="#ff2a1c" opacity="0"><animate attributeName="cy" values="36;36;36;56" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.62;0.7;1" calcMode="spline" keySplines="0 0 1 1;0 0 1 1;0.55 0 1 0.6"/><animate attributeName="opacity" values="0;0;1;0" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.62;0.7;1"/><animate attributeName="ry" values="1.2;1.2;2.2;3" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.62;0.7;1"/></ellipse><ellipse cx="18" cy="58" rx="0" ry="0.8" fill="#b80a12" opacity="0.8"><animate attributeName="rx" values="0;0;0;5;3" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.9;0.92;0.97;1"/><animate attributeName="opacity" values="0;0;0.9;0.5;0" dur="3.2s" repeatCount="indefinite" keyTimes="0;0.9;0.92;0.97;1"/></ellipse></g>
</svg>
