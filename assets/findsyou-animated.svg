<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="FindsYou">
  <title>FindsYou</title>
  <desc>The catch. Listings fall through the V; most pass and fade, one lands and stays.</desc>
  <style>
    /* Six fall, staggered a second apart, so something is always in flight and
       the mark reads as working at 30px. The gold one lands in the V and holds
       through the rest of the cycle: the product in one loop. */
    .f { fill: #6D666D; opacity: 0; animation: fall 6s linear infinite; }
    .f2 { animation-delay: -5s } .f3 { animation-delay: -4s }
    .f4 { animation-delay: -3s } .f5 { animation-delay: -2s } .f6 { animation-delay: -1s }
    .keep { fill: #E3D3A4; animation: catch 6s ease-in-out infinite; }
    .v { animation: glow 6s ease-in-out infinite; }
    @keyframes fall  { 0% { opacity: 0; transform: translateY(-34px) } 14% { opacity: .9 }
                       62% { opacity: 0; transform: translateY(26px) } 100% { opacity: 0; transform: translateY(26px) } }
    @keyframes catch { 0% { opacity: 0; transform: translateY(-34px) }
                       16% { opacity: 1 } 34% { transform: translateY(0) }
                       40% { transform: translateY(-5px) }
                       48%, 100% { opacity: 1; transform: translateY(0) } }
    @keyframes glow  { 0%, 100% { stroke: #8F878F } 40%, 60% { stroke: #E3D3A4 } }
    /* with motion reduced the catch is simply already home */
    @media (prefers-reduced-motion: reduce) {
      .f { display: none } .keep { animation: none; opacity: 1; transform: none }
      .v { animation: none; stroke: #8F878F }
    }
  </style>
  <path class="v" d="M24 34 L60 82 L96 34" fill="none" stroke="#8F878F" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="f f1" cx="38" cy="44" r="6"/>
  <circle class="f f2" cx="82" cy="44" r="6"/>
  <circle class="f f3" cx="30" cy="36" r="6"/>
  <circle class="f f4" cx="90" cy="36" r="6"/>
  <circle class="f f5" cx="46" cy="52" r="6"/>
  <circle class="f f6" cx="74" cy="52" r="6"/>
  <circle class="keep" cx="60" cy="74" r="11"/>
</svg>
