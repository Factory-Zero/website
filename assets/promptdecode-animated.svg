<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="promptdecode">
  <title>promptdecode</title>
  <desc>Three character slots on an amber tile. They resolve from empty boxes into solid glyphs, left to right, then empty again: text a reviewer cannot read being decoded.</desc>
  <style>
    /* Drawn from the site's nav mark and its hero, where the wordmark's letters
       start as the empty boxes a reviewer sees and resolve one at a time. Each
       slot squashes and loses its fill when hidden, so the movement reads as a
       sweep at 30px rather than as three separate blinks. */
    .s {
      fill: #14161A;
      stroke: #14161A;
      stroke-opacity: .5;
      stroke-width: 3.5;
      fill-opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: resolve 3s ease-in-out infinite;
    }
    .s2 { animation-delay: .28s }
    .s3 { animation-delay: .56s }
    @keyframes resolve {
      0%, 10%   { fill-opacity: 0; transform: scaleY(.62) }
      26%, 68%  { fill-opacity: 1; transform: scaleY(1) }
      84%, 100% { fill-opacity: 0; transform: scaleY(.62) }
    }
    /* with motion reduced the mark holds the static one: first glyph decoded,
       the other two still boxed */
    @media (prefers-reduced-motion: reduce) {
      .s { animation: none }
      .s1 { fill-opacity: 1; transform: none }
    }
  </style>
  <rect x="12" y="12" width="96" height="96" rx="30" fill="#F2B53A"/>
  <rect x="13.75" y="13.75" width="92.5" height="92.5" rx="28.25" fill="none" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="3.5"/>
  <rect class="s s1" x="28" y="42" width="16" height="36" rx="4"/>
  <rect class="s s2" x="52" y="42" width="16" height="36" rx="4"/>
  <rect class="s s3" x="76" y="42" width="16" height="36" rx="4"/>
</svg>
