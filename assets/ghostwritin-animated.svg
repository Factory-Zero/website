<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Ghostwritin'">
  <title>Ghostwritin'</title>
  <desc>A ghost writer: a small ghost floats and blinks, and a blue rewrite pass sweeps across, turning a wavy red line underneath into a calm straight one.</desc>
  <defs>
    <clipPath id="gw-tile"><rect x="10" y="10" width="100" height="100" rx="26"/></clipPath>
    <linearGradient id="gw-sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#9fd3ea" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9fd3ea" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9fd3ea" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    /* One 6s cycle: float, blink, then the rewrite pass. */
    .ghost { animation: float 6s ease-in-out infinite; }
    .eye   { transform-box: fill-box; transform-origin: center; animation: blink 6s ease-in-out infinite; }
    .sweep { animation: sweep 6s cubic-bezier(.6,.05,.3,1) infinite; }
    .wavy  { animation: wavy 6s steps(1,end) infinite; }
    .calm  { animation: calm 6s steps(1,end) infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
    @keyframes blink { 0%,30%,36%,100% { transform: scaleY(1) } 33% { transform: scaleY(.1) } }
    @keyframes sweep { 0%,50% { transform: translateX(-60px) } 80%,100% { transform: translateX(130px) } }
    @keyframes wavy  { 0% { opacity: 1 } 65% { opacity: 0 } }
    @keyframes calm  { 0% { opacity: 0 } 65% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .ghost, .eye, .sweep, .wavy, .calm { animation: none }
      .sweep, .wavy { opacity: 0 }
      .calm { opacity: 1 }
    }
  </style>
  <rect x="10" y="10" width="100" height="100" rx="26" fill="#262b33"/>
  <g clip-path="url(#gw-tile)">
    <g class="ghost">
      <path d="M38 86V56a22 22 0 0 1 44 0v30l-7.33-6-7.33 6-7.34-6-7.33 6-7.34-6z" fill="#f4f7fa"/>
      <ellipse class="eye" cx="51" cy="57" rx="3.6" ry="4.4" fill="#262b33"/>
      <ellipse class="eye" cx="69" cy="57" rx="3.6" ry="4.4" fill="#262b33"/>
    </g>
    <path class="wavy" d="M34 97q4-4 8 0t8 0 8 0 8 0 8 0 8 0 8 0" fill="none" stroke="#d1453b" stroke-width="2.5" stroke-linecap="round"/>
    <path class="calm" d="M34 97H86" fill="none" stroke="#2f7fb0" stroke-width="2.5" stroke-linecap="round" opacity="0"/>
    <rect class="sweep" x="0" y="10" width="40" height="100" fill="url(#gw-sweep)"/>
  </g>
</svg>
