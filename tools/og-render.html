<!DOCTYPE html>
<!-- Source for assets/og.png and the per-page og-*.png cards. Regenerate with tools/render-og.sh -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Tokens mirror assets/fz-ui.css (see DESIGN.md). */
  :root{--bg:#0A0B0A;--fg:#EDEFE8;--fg-2:#B4B8AE;--fg-3:#858A80;--hair:rgba(237,240,230,.09);--hair-2:rgba(237,240,230,.16);
        --acc:#C6FF3D;--hl:linear-gradient(90deg,rgba(198,255,61,.26),rgba(185,168,255,.26))}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);width:1200px;height:630px;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;color:var(--fg);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .art{position:absolute;top:0;right:0;width:760px;height:630px;background:url(../assets/ui/hero.webp) 62% 50%/cover no-repeat}
  .veil{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,var(--bg) 40%,rgba(10,11,10,.82) 56%,rgba(10,11,10,.15) 78%,rgba(10,11,10,.35) 100%)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);background-size:100px 100px;mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.4) 55%,transparent 75%)}
  .content{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:52px 64px}
  .top{display:flex;align-items:center;gap:14px}
  .wm{display:inline-flex;align-items:center;gap:12px;font-weight:600;font-size:22px;letter-spacing:-.01em}
  .wm .o{width:22px;height:22px;border:2.5px solid var(--acc)}
  .wm .k{color:var(--fg-3);font:500 13px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;padding-left:12px;border-left:1px solid var(--hair-2)}
  .mid{display:flex;flex-direction:column;justify-content:center;gap:22px}
  .kicker{display:flex;align-items:center;gap:10px;font:500 14px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--fg-3);text-transform:uppercase}
  .kicker::before{content:"";width:8px;height:8px;background:var(--acc)}
  h1{margin:0;max-width:13.5ch;font-weight:300;font-size:72px;line-height:1.02;letter-spacing:-.035em}
  h1 .hl{background:var(--hl);padding:0 .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .sub{max-width:40ch;font-weight:300;font-size:22px;line-height:1.4;color:var(--fg-2)}
  .bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding-top:22px;border-top:1px solid var(--hair-2);
          font:500 14px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--fg-3)}
  .stats{display:flex;gap:36px}
  .stats b{display:block;font:300 34px/1 'Inter Tight',sans-serif;letter-spacing:-.02em;color:var(--fg);margin-bottom:8px}
  .url{color:var(--fg)}
  .url i{font-style:normal;color:var(--acc)}
</style>
</head>
<body>
<div class="card">
  <div class="art"></div>
  <div class="veil"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="top"><span class="wm"><span class="o"></span>Factory Zero<span class="k">FZ/01</span></span></div>
    <div class="mid">
      <div class="kicker" id="kind">AI-native venture studio</div>
      <h1 id="title">The foundation to launch <span class="hl">ventures</span> at scale.</h1>
      <div class="sub" id="sub" hidden></div>
    </div>
    <div class="bottom">
      <div class="stats" id="stats">
        <div><b id="n-v">–</b>VENTURES</div>
        <div><b id="n-s">–</b>ON THE FZ STACK</div>
        <div><b id="n-f">–</b>FILMS</div>
      </div>
      <div class="url">factory0<i>.</i>ventures</div>
    </div>
  </div>
</div>
<script src="../assets/fz-data.js"></script>
<script>
// Real counts from assets/fz-data.js (the same source as the home page stats).
(function () {
  var d = (window.FZ_DATA || {}), v = d.ventures || [], films = d.films || [];
  var pad = function (n) { return n < 10 ? '0' + n : String(n); };
  document.getElementById('n-v').textContent = pad(v.length);
  document.getElementById('n-s').textContent = pad(v.filter(function (x) { return x.stack; }).length);
  document.getElementById('n-f').textContent = pad(films.length);
  // Per-page overrides: ?t=title&k=kicker&s=subline (sub replaces the stats row's role as context)
  var q = new URLSearchParams(location.search);
  if (q.get('t')) document.getElementById('title').textContent = q.get('t');
  if (q.get('k')) document.getElementById('kind').textContent = q.get('k');
  if (q.get('s')) { var s = document.getElementById('sub'); s.textContent = q.get('s'); s.hidden = false; }
})();
</script>
</body>
</html>
