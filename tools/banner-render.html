<!DOCTYPE html>
<!-- Source for assets/readme-banner.png. Regenerate with tools/render-og.sh -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0B0A;--fg:#EDEFE8;--fg-3:#858A80;--hair:rgba(237,240,230,.09);--hair-2:rgba(237,240,230,.16);--acc:#C6FF3D}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);width:1280px;height:400px;overflow:hidden}
  .b{position:relative;width:1280px;height:400px;color:var(--fg);font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .art{position:absolute;top:0;right:0;width:640px;height:400px;background:url(../assets/ui/hero.webp) 62% 55%/cover no-repeat}
  .veil{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,var(--bg) 45%,rgba(10,11,10,.7) 62%,rgba(10,11,10,.1) 85%)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);background-size:80px 80px;mask-image:linear-gradient(90deg,#000,transparent 70%)}
  .c{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:0 72px}
  .wm{display:inline-flex;align-items:center;gap:16px;font-weight:600;font-size:46px;letter-spacing:-.02em}
  .wm .t{font-size:42px;letter-spacing:.2em}
  .wm .o{width:38px;height:38px;margin-left:-14px;border:4px solid var(--acc);border-top-color:transparent;border-radius:50%}
  .tag{font-weight:300;font-size:28px;letter-spacing:-.01em}
  .meta{display:flex;align-items:center;gap:10px;font:500 13px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;color:var(--fg-3)}
  .meta::before{content:"";width:8px;height:8px;background:var(--acc)}
</style>
</head>
<body>
<div class="b">
  <div class="art"></div><div class="veil"></div><div class="grid"></div>
  <div class="c">
    <div class="wm"><span class="t">FACTORY ZER</span><span class="o"></span></div>
    <div class="tag">The foundation to launch ventures at scale.</div>
    <div class="meta">AI-NATIVE VENTURE STUDIO · FZ/01 · FACTORY0.VENTURES</div>
  </div>
</div>
</body>
</html>
